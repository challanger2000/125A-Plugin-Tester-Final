name: Publish verified 125A Tester v0.2.10
on:
  push:
    branches: [fix/tester-v0.2.10-nine-audit-findings]
    paths:
      - '.github/workflows/publish-v0.2.10.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable Windows QA evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38744097119" --jq '.head_sha')
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38744097119" --jq '.conclusion')
          test "$actual" = "ec2db65b9b9dbce2b7a5d146cb54869c9ad82e6d"
          test "$conclusion" = "success"
      - name: Download exact Windows QA artifact
        uses: actions/download-artifact@v4
        with:
          name: 125A-Plugin-Tester-Windows-x64
          run-id: 38744097119
          github-token: ${{ github.token }}
          path: release
      - name: Validate binary and pack FINAL
        shell: bash
        run: |
          set -euo pipefail
          test -f release/125A_Plugin_Tester.exe
          test "$(sha256sum release/125A_Plugin_Tester.exe | cut -d' ' -f1)" = "b0f386422d107ac6fa8b15c3e1e86113f52b013e277fc94b16d28b929438bfea"
          cd release
          zip -q -9 125A_Plugin_Tester_v0.2.10_Windows_x64_FINAL.zip 125A_Plugin_Tester.exe
          unzip -t 125A_Plugin_Tester_v0.2.10_Windows_x64_FINAL.zip
      - name: Publish GitHub release pinned to tested source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag v0.2.10 already exists: aborting to avoid overwrite'
            exit 1
          fi
          cat >release/RELEASE-NOTES.txt <<'EOF'
          125A Plugin Tester v0.2.10 - Windows x64
          Standalone portable QA utility (not a VST3 plug-in).
          Exact tested source: ec2db65b9b9dbce2b7a5d146cb54869c9ad82e6d
          QA run: https://github.com/challanger2000/125A-Plugin-Tester-Final/actions/runs/38744097119
          16 positive/negative VST3 fixtures including callback heap and blocking API controls.
          Separate 100-profile process matrix, MIDI/transport, GUI/audio concurrency, report and crash guards.
          Callback instrumentation detects direct imported Win32 heap and potentially blocking API calls; it does not comprehensively detect custom allocators, dynamically resolved calls or all internal locks.
          Portable EXE SHA-256: b0f386422d107ac6fa8b15c3e1e86113f52b013e277fc94b16d28b929438bfea
          Earlier stable v0.2.9 remains on main.
          EOF
          gh release create v0.2.10 --repo "$GITHUB_REPOSITORY" --target ec2db65b9b9dbce2b7a5d146cb54869c9ad82e6d --title "125A Plugin Tester v0.2.10 Windows x64 FINAL" --notes-file release/RELEASE-NOTES.txt release/125A_Plugin_Tester.exe release/125A_Plugin_Tester_v0.2.10_Windows_x64_FINAL.zip
