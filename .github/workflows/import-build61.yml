# Import the exact verified artifact from development run #61.
name: Import verified build 61

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-build61.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download verified build 61 artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-41c4-8210-86be-1d3a57ddfb9b/raw?se=2026-09-13T19%3A09%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=ff49cb7d-8eb2-520e-8e55-3165b043bd6a&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T05%3A08%3A59Z&ske=2026-09-14T05%3A08%3A59Z&sks=b&skv=2026-02-06&sig=yLfLFPOuWqnHBTxXfJu4nsq04peIA3VGzz%2BBCeIUaAA%3D'
          Invoke-WebRequest -Uri $url -OutFile build61.zip
          $zipHash = (Get-FileHash build61.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne 'c4b383c585cdcb47851ea72707c57ec6207532d2e40d2dffb5c0fdfe23573131') { throw "ZIP SHA256 mismatch: $zipHash" }
          Expand-Archive build61.zip -DestinationPath imported -Force
          $exe = Get-Item imported\125A_Plugin_Tester.exe
          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -ne 'ccecd15be30abba2601c4af405c8a9fa8be3afb7d7ec9d8cf535272462057e2b') { throw "EXE SHA256 mismatch: $exeHash" }
          Copy-Item $exe.FullName .\125A_Plugin_Tester.exe -Force
          Write-Host "Verified build 61 imported successfully."

      - name: Commit verified executable
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 125A_Plugin_Tester.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No executable change to commit."
            exit 0
          }
          git commit -m "Add verified 125A Plugin Tester v0.2.0 build 61"
          git pull --rebase origin main
          git push origin HEAD:main
