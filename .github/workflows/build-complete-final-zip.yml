name: Build complete final ZIP

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-complete-final-zip.yml']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source snapshot
        shell: pwsh
        run: |
          $url = 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6618-8211-8224-ea5776637998/raw?se=2026-09-13T19%3A41%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=84c8acd8-5122-53fd-be6a-611a5015d7af&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T08%3A17%3A30Z&ske=2026-09-14T08%3A17%3A30Z&sks=b&skv=2026-02-06&sig=iTiMZW9n%2B7NiuAqRp3CC3IFEpNDqWnfaKLmHYYlEC/s%3D'
          Invoke-WebRequest -Uri $url -OutFile source.zip
          $sha = (Get-FileHash source.zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne '3d55d9c51686efb61eabf97c22c2fa001a3516de7475fd4969f67a28cfd538fb') { throw "Source artifact hash mismatch: $sha" }
          Expand-Archive source.zip source -Force
      - name: Build complete package
        shell: pwsh
        run: |
          $root = 'package-root'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item 125A_Plugin_Tester.exe $root\ -Force
          Copy-Item README.md $root\ -Force
          Copy-Item LICENSE-NOTE.txt $root\ -Force
          Copy-Item docs\125A_Plugin_Tester_Handbuch_DE.pdf $root\ -Force
          Copy-Item docs\125A_Plugin_Tester_User_Guide_EN.pdf $root\ -Force
          New-Item -ItemType Directory -Path $root\Source -Force | Out-Null
          Copy-Item source\* $root\Source -Recurse -Force
          if (Test-Path source\.github) { Copy-Item source\.github $root\Source\.github -Recurse -Force }

          $required = @(
            "$root\125A_Plugin_Tester.exe",
            "$root\README.md",
            "$root\LICENSE-NOTE.txt",
            "$root\125A_Plugin_Tester_Handbuch_DE.pdf",
            "$root\125A_Plugin_Tester_User_Guide_EN.pdf",
            "$root\Source\CMakeLists.txt",
            "$root\Source\SOURCE-README.md",
            "$root\Source\src\main.cpp",
            "$root\Source\src\launcher.cpp",
            "$root\Source\tests\qa_fixture.cpp",
            "$root\Source\.github\workflows\build-windows.yml"
          )
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing before ZIP: $f" } }
          $srcCount = (Get-ChildItem "$root\Source\src" -File).Count
          if ($srcCount -ne 22) { throw "Expected 22 source files, got $srcCount" }

          $zip = 'dist\125A-Plugin-Tester-v0.2.0-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$root\*" -DestinationPath $zip -Force

          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip verify -Force
          foreach ($f in @(
            'verify\125A_Plugin_Tester.exe',
            'verify\README.md',
            'verify\LICENSE-NOTE.txt',
            'verify\125A_Plugin_Tester_Handbuch_DE.pdf',
            'verify\125A_Plugin_Tester_User_Guide_EN.pdf',
            'verify\Source\CMakeLists.txt',
            'verify\Source\SOURCE-README.md',
            'verify\Source\src\main.cpp',
            'verify\Source\src\launcher.cpp',
            'verify\Source\tests\qa_fixture.cpp',
            'verify\Source\.github\workflows\build-windows.yml'
          )) { if (!(Test-Path $f)) { throw "Missing after ZIP extraction: $f" } }
          $srcCount2 = (Get-ChildItem verify\Source\src -File).Count
          if ($srcCount2 -ne 22) { throw "ZIP source count mismatch: $srcCount2" }
          $fileCount = (Get-ChildItem verify -Recurse -File).Count
          if ($fileCount -ne 32) { throw "Expected 32 files in final ZIP, got $fileCount" }
          Remove-Item verify -Recurse -Force
          Remove-Item $root -Recurse -Force
          Remove-Item source -Recurse -Force
          Remove-Item source.zip -Force
      - name: Commit complete ZIP
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist\125A-Plugin-Tester-v0.2.0-Windows-x64.zip
          git commit -m "Replace release ZIP with complete source package"
          git pull --rebase origin main
          git push origin HEAD:main
