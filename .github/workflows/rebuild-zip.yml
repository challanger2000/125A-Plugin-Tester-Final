name: Rebuild release ZIP

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rebuild-zip.yml']

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild ZIP with 7-Zip and verify
        shell: pwsh
        run: |
          $zip = 'dist\125A-Plugin-Tester-v0.2.0-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          7z a -tzip $zip 125A_Plugin_Tester.exe docs\125A_Plugin_Tester_Handbuch_DE.pdf docs\125A_Plugin_Tester_User_Guide_EN.pdf
          7z t $zip
          New-Item -ItemType Directory -Path zip-test -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath zip-test -Force
          if (!(Test-Path 'zip-test\125A_Plugin_Tester.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'zip-test\125A_Plugin_Tester_Handbuch_DE.pdf')) { throw 'DE PDF missing after extraction' }
          if (!(Test-Path 'zip-test\125A_Plugin_Tester_User_Guide_EN.pdf')) { throw 'EN PDF missing after extraction' }
          Remove-Item zip-test -Recurse -Force
      - name: Commit verified ZIP
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist\125A-Plugin-Tester-v0.2.0-Windows-x64.zip
          git commit -m "Rebuild and verify Windows release ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
