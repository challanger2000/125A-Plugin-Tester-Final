name: Build 125A Plugin Tester

on:
  push:
    branches: [main, fix/tester-v0.2.10-nine-audit-findings, release/v0.2.10-final, fix/v0.3-validator-midi-diagnostics, fix/v0.3.1-parameter-text-classification, fix/v0.3.2-mixfx-realtime-evidence]
  workflow_dispatch:

concurrency:
  group: tester-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # The source provenance gate must see the approved release ancestor.

      - name: Enforce verified v0.2.10 source baseline
        shell: pwsh
        run: python scripts/verify_release_baseline.py

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build
        run: cmake --build build --config Release --target PluginTester125ADispatcherSelfTest PluginTester125ADispatcher PluginTester125AGui PluginTester125APortableStub PluginTester125AHelperPacker PluginTester125ALauncher PluginTester125AWorker PluginTester125AReloadProbe PluginTester125AStateProbe PluginTester125AEditorLifecycleProbe PluginTester125AIOEventProbe PluginTester125AValidatorWrapper PluginTester125AGuardSelfTest validator PluginTester125AQAGoodControl PluginTester125AQABadLifecycle PluginTester125AQABadNaN PluginTester125AQABadState PluginTester125AQABadIO PluginTester125AQAGoodEditor PluginTester125AQABadEditor PluginTester125AQABadIgnoredState PluginTester125AQABad64Bit PluginTester125AQAGainReference PluginTester125AQABadGain PluginTester125AQABadConcurrentAudio PluginTester125AQAGoodEventEcho PluginTester125AQABadMissingEvent PluginTester125AQABadCallbackHeap PluginTester125AQABadCallbackLock PluginTester125AQABadSharedController PluginTester125AQAGoodEventPartition PluginTester125AQABadEventPartition PluginTester125AQAGoodPeerViews PluginTester125AQABadPeerViews PluginTester125AQABadThirdRestore PluginTester125AQABadEventMetadata PluginTester125AQABadPeerCleanup PluginTester125AQABadEventEchoFields PluginTester125AQAGoodDenseMultiMIDI PluginTester125AQABadDenseMultiMIDI PluginTester125AQAGoodReadOnlyMeter PluginTester125AQABadEditableOnOff PluginTester125AQAGoodMixFx PluginTester125AQABadMixFx --parallel

      - name: Verify dispatcher classification, guard precedence and report errors
        shell: pwsh
        run: |
          $selftest = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_DispatcherSelfTest.exe | Select-Object -First 1
          if (-not $selftest) { throw "Dispatcher self-test executable missing" }
          & $selftest.FullName
          if ($LASTEXITCODE -ne 0) { throw "Dispatcher classification self-test failed with exit $LASTEXITCODE" }
          $gui = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_GUI.exe | Select-Object -First 1
          if (-not $gui) { throw "Production GUI executable missing for status selftest" }
          $guiCheck = Start-Process -FilePath $gui.FullName -ArgumentList "--qa-status-selftest" -Wait -PassThru
          if ($guiCheck.ExitCode -ne 0) { throw "GUI guard precedence selftest failed: exit $($guiCheck.ExitCode)" }
          Write-Host "GUI PASS/FAIL/INCONCLUSIVE status precedence selftest PASS"

      - name: Verify production Job Object guard
        shell: pwsh
        run: |
          $launcher = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester.exe | Select-Object -First 1
          $single = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_Single.exe | Select-Object -First 1
          $helper = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_GuardSelfTest.exe | Select-Object -First 1
          if (-not $launcher) { throw "125A_Plugin_Tester.exe not found" }
          if (-not $single) { throw "125A_Plugin_Tester_Single.exe not found" }
          if (-not $helper) { throw "125A_Plugin_Tester_GuardSelfTest.exe not found" }
          & $launcher.FullName --guard-selftest $helper.FullName
          if ($LASTEXITCODE -ne 0) { throw "Production launcher guard self-test failed with exit code $LASTEXITCODE" }

      - name: Verify independent DSP callback timing mean
        shell: pwsh
        run: |
          $worker = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_Worker.exe | Select-Object -First 1
          if (-not $worker) { throw "Worker executable missing for true DSP timing selftest" }
          & $worker.FullName --qa-realtime-timing-selftest
          if ($LASTEXITCODE -ne 0) { throw "Realtime mean must exclude host pacing and sleeps" }
          Write-Host "[PASS] Real process callback mean independent of host-paced elapsed time"

      - name: Verify Steinberg validator self-test
        shell: pwsh
        run: |
          $validator = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_SteinbergValidator.exe | Select-Object -First 1
          $validatorCore = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_SteinbergValidatorCore.exe | Select-Object -First 1
          if (-not $validator) { throw "125A_Plugin_Tester_SteinbergValidator.exe not found" }
          if (-not $validatorCore) { throw "125A_Plugin_Tester_SteinbergValidatorCore.exe not found" }
          & $validator.FullName -selftest
          if ($LASTEXITCODE -ne 0) { throw "Steinberg validator self-test failed with exit code $LASTEXITCODE" }
          & $validator.FullName --qa-summary-selftest
          if ($LASTEXITCODE -ne 0) { throw "Validator summary PASS/FAIL/ZERO/MISSING oracle selftest failed" }
          Write-Host "[PASS] Validator 0/0 cannot masquerade as validator PASS"

      - name: Verify tester specificity, sensitivity and JSON with VST3 fixtures
        shell: pwsh
        run: |
          $launcher = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester.exe | Select-Object -First 1
          if (-not $launcher) { throw "125A_Plugin_Tester.exe not found" }

          $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path (Get-Location) "build\qa-reports"
          Remove-Item $env:125A_PLUGIN_TESTER_REPORT_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:125A_PLUGIN_TESTER_REPORT_DIR | Out-Null

          function Find-Fixture([string]$name) {
            $f = Get-ChildItem build -Recurse -Directory -Filter "$name.vst3" | Select-Object -First 1
            if (-not $f) { throw "$name.vst3 fixture not found" }
            return $f
          }
          function Find-Report([string]$stem, [string]$suffix) {
            Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "${stem}_*${suffix}" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          function Dump-FixtureDiagnostics([string]$stem) {
            Write-Host "----- BEGIN 125A FIXTURE DIAGNOSTICS -----"
            foreach ($file in (Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "${stem}_*" -ErrorAction SilentlyContinue)) {
              Write-Host "===== $($file.FullName) ====="
              Get-Content $file.FullName -Raw | Write-Host
            }
            Write-Host "----- END 125A FIXTURE DIAGNOSTICS -----"
          }
          function Run-Fixture([string]$name, [int]$expectedExit, [string]$expectedStatus, [string]$requiredReportText, [string]$requiredIoText = "", [string]$requiredEditorText = "") {
            $fixture = Find-Fixture $name
            $stem = [System.IO.Path]::GetFileNameWithoutExtension($fixture.Name)
            Write-Host "Running production tester against $($fixture.FullName)"
            & $launcher.FullName $fixture.FullName
            $actual = $LASTEXITCODE
            $guard = Find-Report $stem "_125A_QA_Guard_Report.txt"
            $report = Find-Report $stem "_125A_QA_Report.txt"
            $json = Find-Report $stem "_125A_QA_Report.json"
            $ioProbe = Find-Report $stem "_125A_IO_Event_Probe.txt"
            $editorProbe = Find-Report $stem "_125A_Editor_Lifecycle_Probe.txt"
            if ($actual -ne $expectedExit) { Dump-FixtureDiagnostics $stem; throw "$name returned launcher exit $actual; expected $expectedExit" }
            if ($guard) { Dump-FixtureDiagnostics $stem; throw "$name produced a guard/inconclusive report during a deterministic fixture test" }
            if (-not $report) { Dump-FixtureDiagnostics $stem; throw "$name did not produce the expected QA report" }
            if (-not $json) { Dump-FixtureDiagnostics $stem; throw "$name did not produce the expected JSON report" }
            if (-not $ioProbe) { Dump-FixtureDiagnostics $stem; throw "$name did not produce the structured I/O/event probe report" }
            if (-not $editorProbe) { Dump-FixtureDiagnostics $stem; throw "$name did not produce the structured editor lifecycle probe report" }
            $reportText = Get-Content $report.FullName -Raw
            if (-not $reportText.Contains($requiredReportText)) { Dump-FixtureDiagnostics $stem; throw "$name report did not contain expected evidence: $requiredReportText" }
            $ioText = Get-Content $ioProbe.FullName -Raw
            if (-not $ioText.Contains("ExitCode: ") -or -not $ioText.Contains("Result: ") -or -not $ioText.Contains("FirstFailure: ")) { Dump-FixtureDiagnostics $stem; throw "$name I/O probe report is missing structured fields" }
            if ($ioText.Contains("Result: FAIL") -and $ioText.Contains("FirstFailure: None")) { Dump-FixtureDiagnostics $stem; throw "$name I/O probe reported FAIL without a concrete first failure" }
            if ($requiredIoText -and -not $ioText.Contains($requiredIoText)) { Dump-FixtureDiagnostics $stem; throw "$name I/O probe did not contain expected evidence: $requiredIoText" }
            $editorText = Get-Content $editorProbe.FullName -Raw
            if (-not $editorText.Contains("Version: 0.3.2")) { Dump-FixtureDiagnostics $stem; throw "$name editor lifecycle probe has wrong tester version" }
            if ($requiredEditorText -and -not $editorText.Contains($requiredEditorText)) { Dump-FixtureDiagnostics $stem; throw "$name editor lifecycle probe did not contain expected evidence: $requiredEditorText" }
            $jsonData = Get-Content $json.FullName -Raw | ConvertFrom-Json
            if ($jsonData.schemaVersion -ne 1) { throw "$name JSON schemaVersion was not 1" }
            if ($jsonData.status -ne $expectedStatus) { throw "$name JSON status $($jsonData.status); expected $expectedStatus" }
            if ($jsonData.pluginPath -ne $fixture.FullName) { throw "$name JSON pluginPath mismatch" }
            if (-not $jsonData.pluginId) { throw "$name JSON pluginId missing" }
            Write-Host "[PASS] $name returned expected exit/status and produced matching TXT + JSON + structured I/O evidence"
          }

          Run-Fixture "125A_QA_GoodControl" 0 "PASS" "0 WARNING / 0 FAIL" "Result: PASS"
          Run-Fixture "125A_QA_BadLifecycle" 1 "FAIL" "[FAIL] Audio torture processing state (32-bit) - setProcessing(true) failed"
          Run-Fixture "125A_QA_BadNaN" 1 "FAIL" "[FAIL] Audio Silence process (32-bit)"
          Run-Fixture "125A_QA_BadState" 1 "FAIL" "[FAIL] Component state roundtrip - setState rejected the state returned by getState"
          Run-Fixture "125A_QA_BadIgnoredState" 1 "FAIL" "[FAIL] Fresh-instance state verification"
          Run-Fixture "125A_QA_Bad64Bit" 1 "FAIL" "[FAIL] Audio Silence process (64-bit)"
          Run-Fixture "125A_QA_GainReference" 0 "PASS" "[PASS] Semantic state reference - Restored state recovered the measured gain response"
          Run-Fixture "125A_QA_BadGain" 1 "FAIL" "[FAIL] Functional reference profile"
          Run-Fixture "125A_QA_BadConcurrentAudio" 1 "FAIL" "[FAIL] Editor lifecycle / GUI runtime"
          Run-Fixture "125A_QA_GoodEventEcho" 0 "PASS" "[PASS] I/O, sidechain and event isolation"
          Run-Fixture "125A_QA_BadMissingEvent" 1 "FAIL" "[FAIL] I/O, sidechain and event isolation" "[FAIL] Event completeness"
          Run-Fixture "125A_QA_BadCallbackHeap" 1 "FAIL" "[FAIL] Callback API tracing"
          Run-Fixture "125A_QA_BadCallbackLock" 0 "WARNING" "[WARN] Callback API tracing"
          Run-Fixture "125A_QA_BadSharedController" 1 "FAIL" "[FAIL] Fresh-instance state verification"
          Run-Fixture "125A_QA_GoodEventPartition" 0 "PASS" "[PASS] I/O, sidechain and event isolation" "[PASS] SA02 block partition equivalence"
          Run-Fixture "125A_QA_BadEventPartition" 1 "FAIL" "[FAIL] I/O, sidechain and event isolation" "[FAIL] SA02 block partition equivalence"
          Run-Fixture "125A_QA_GoodPeerViews" 0 "PASS" "[PASS] Editor lifecycle / GUI runtime" "" "Result: PASS - SA01 peer-view notification"
          Run-Fixture "125A_QA_BadPeerViews" 1 "FAIL" "[FAIL] Editor lifecycle / GUI runtime" "" "FAIL - SA01 peer-view controller notification or cleanup oracle"
          Run-Fixture "125A_QA_BadPeerCleanup" 1 "FAIL" "[FAIL] Editor lifecycle / GUI runtime" "" "FAIL - SA01 peer-view controller notification or cleanup oracle"
          Run-Fixture "125A_QA_BadEventMetadata" 1 "FAIL" "[FAIL] I/O, sidechain and event isolation" "[FAIL] SA02 block partition equivalence"
          Run-Fixture "125A_QA_BadEventEchoFields" 1 "FAIL" "[FAIL] I/O, sidechain and event isolation" "[FAIL] SA02 block partition equivalence"
          Run-Fixture "125A_QA_GoodDenseMultiMIDI" 0 "PASS" "0 WARNING / 0 FAIL" "output events=640"
          Run-Fixture "125A_QA_BadDenseMultiMIDI" 1 "FAIL" "[FAIL] I/O, sidechain and event isolation" "FirstFailure: Event stress - process() returned "
          # Read-only meter text must remain readable, but need not be parsed
          # as an editable value. This fixture's reverse parser rejects READY.
          Run-Fixture "125A_QA_GoodReadOnlyMeter" 0 "PASS" "0 WARNING / 0 FAIL"
          $meter = Find-Report "125A_QA_GoodReadOnlyMeter" "_125A_QA_Report.txt"
          if (-not $meter -or -not (Get-Content $meter.FullName -Raw).Contains("reverse text input correctly NOT APPLICABLE")) {
            throw "Read-only meter text MUST be treated NOT APPLICABLE, not WARNING"
          }
          # The opposite negative control must STILL warn when a writable
          # boolean exposes text which cannot recover its On state.
          Run-Fixture "125A_QA_BadEditableOnOff" 0 "WARNING" "Parameter text input"
          # The Steinberg validator recognizes only standard Audio Module Class;
          # PreSonus Audio Mix Processor reports 0/0. Our own native probe must
          # still accept a valid MixFX category and reject a broken one.
          Run-Fixture "125A_QA_GoodMixFX" 0 "WARNING" "Audio Mix Processor is not a standard Steinberg validator target" "Result: PASS"
          Run-Fixture "125A_QA_BadMixFX" 1 "FAIL" "[FAIL] I/O, sidechain and event isolation" "FirstFailure: Bus arrangement - out-of-range bus index was accepted"
          $mixfxJson = Find-Report "125A_QA_GoodMixFX" "_125A_QA_Report.json"
          if (-not $mixfxJson) { throw "MixFX positive QA JSON missing" }
          $mixfxData = Get-Content $mixfxJson.FullName -Raw | ConvertFrom-Json
          if ($mixfxData.status -ne "WARNING") { throw "MixFX 0/0 must remain WARNING, never fabricated PASS" }
          $mixfxText = (Find-Report "125A_QA_GoodMixFX" "_125A_QA_Report.txt")
          if (-not $mixfxText -or -not (Get-Content $mixfxText.FullName -Raw).Contains("MixFX processing coverage")) {
            throw "MixFX QA must document generic and host-specific coverage separately"
          }
          Run-Fixture "125A_QA_BadThirdRestore" 1 "FAIL" "[FAIL] Fresh-instance state verification"
          # A-B-A sequence: semantic expectation independently checked by
          # controller normalized value, re-serialized logical gain and PCM.
          $goodCycles = Find-Report "125A_QA_GainReference" "_125A_State_Cycle_Probe.txt"
          $badCycles = Find-Report "125A_QA_BadThirdRestore" "_125A_State_Cycle_Probe.txt"
          if (-not $goodCycles -or -not $badCycles) { throw "State-cycle evidence is missing" }
          $goodCycleText = Get-Content $goodCycles.FullName -Raw
          $badCycleText = Get-Content $badCycles.FullName -Raw
          $goodPasses = ([regex]::Matches($goodCycleText, '(?m)^Result: PASS$')).Count
          $badPasses = ([regex]::Matches($badCycleText, '(?m)^Result: PASS$')).Count
          $badFailures = ([regex]::Matches($badCycleText, '(?m)^Result: FAIL$')).Count
          if ($goodPasses -ne 3 -or $goodCycleText.Contains("Result: FAIL")) {
            throw "Repeated state recall positive control does not prove A/B/A: $goodCycleText"
          }
          if ($badPasses -ne 2 -or $badFailures -ne 1 -or
              -not $badCycleText.Contains("Cycle: 3")) {
            throw "Repeated state recall missed the deliberate third-restore defect: $badCycleText"
          }
          if (-not $goodCycleText.Contains("Expected PCM: ") -or
              -not $badCycleText.Contains("Observed PCM: ")) {
            throw "No independent PCM observation in state-cycle evidence"
          }
          Write-Host "Repeated A/B/A state oracle PASS: good 3/3 and known bad 2 PASS + 1 FAIL"
          # Independent oracle: compare actual B against pre-edit expected B.
          # The good and deliberately defective fixtures run through the SAME
          # production launcher/state probe, not a simplified test duplicate.
          $positive = Find-Report "125A_QA_GainReference" "_125A_MultiInstance_Probe.txt"
          $negative = Find-Report "125A_QA_BadSharedController" "_125A_MultiInstance_Probe.txt"
          if (-not $positive -or -not $negative) { throw "Multi-instance oracle evidence report missing" }
          $positiveText = Get-Content $positive.FullName -Raw
          $negativeText = Get-Content $negative.FullName -Raw
          if (-not $positiveText.Contains("Result: PASS")) {
            throw "Known-good controller independence was not proved: $positiveText"
          }
          if (-not $negativeText.Contains("Result: FAIL")) {
            throw "Deliberately shared-global controller state was not detected: $negativeText"
          }
          $expected = [regex]::Match($negativeText, 'Expected B: ([0-9.]+)').Groups[1].Value
          $observed = [regex]::Match($negativeText, 'Observed B: ([0-9.]+)').Groups[1].Value
          if (-not $expected -or -not $observed -or $expected -eq $observed) {
            throw "Negative oracle lacks independent differing expected/observed B values: $negativeText"
          }
          Write-Host "Multi-instance independent controller oracle PASS: good stayed constant, known-bad shared state changed"

          Run-Fixture "125A_QA_BadIO" 1 "FAIL" "[FAIL] I/O, sidechain and event isolation" "[FAIL] Bus arrangement - out-of-range bus index was accepted"
          # An old successful cycle sidecar must be removed for each fresh
          # run, even if the current plugin does not have a cycle oracle.
          $badIoReport = Find-Report "125A_QA_BadIO" "_125A_QA_Report.txt"
          if (-not $badIoReport) { throw "BadIO QA report unavailable for stale-sidecar test" }
          $obsoleteCyclePath = $badIoReport.FullName.Replace(
            "_125A_QA_Report.txt", "_125A_State_Cycle_Probe.txt")
          Set-Content -LiteralPath $obsoleteCyclePath -Value "STALE PASS FROM PREVIOUS RUN"
          Run-Fixture "125A_QA_BadIO" 1 "FAIL" "[FAIL] I/O, sidechain and event isolation" "[FAIL] Bus arrangement - out-of-range bus index was accepted"
          if (Test-Path -LiteralPath $obsoleteCyclePath) {
            throw "Old cycle oracle evidence was not purged at start: $obsoleteCyclePath"
          }
          Write-Host "State-cycle sidecar stale-report purge PASS"
          Run-Fixture "125A_QA_GoodEditor" 0 "PASS" "[PASS] Editor lifecycle / GUI runtime" "" "Result: PASS"
          Run-Fixture "125A_QA_BadEditor" 1 "FAIL" "last reached stage: class 125A QA Bad Editor - cycle 2 - removed" "" "Stage: class 125A QA Bad Editor - cycle 2 - removed"

          # Fault occurs after the launcher's stale-report preflight, proving
          # StateProbe exit 2 -> launcher 2 -> dispatcher INCONCLUSIVE + JSON.
          $healthyFixture = Find-Fixture "125A_QA_GainReference"
          $env:125A_TESTER_QA_INJECT_CYCLE_OPEN_ERROR = "1"
          try {
            & $launcher.FullName $healthyFixture.FullName
            $injectedExit = $LASTEXITCODE
          } finally {
            Remove-Item Env:125A_TESTER_QA_INJECT_CYCLE_OPEN_ERROR -ErrorAction SilentlyContinue
          }
          $injectedGuard = Find-Report "125A_QA_GainReference" "_125A_QA_Guard_Report.txt"
          $injectedJson = Find-Report "125A_QA_GainReference" "_125A_QA_Report.json"
          if ($injectedExit -ne 2 -or -not $injectedGuard -or -not $injectedJson) {
            throw "Evidence fault incorrectly classified: exit=$injectedExit guard=$injectedGuard json=$injectedJson"
          }
          $injectedGuardText = Get-Content $injectedGuard.FullName -Raw
          $injectedJsonData = Get-Content $injectedJson.FullName -Raw | ConvertFrom-Json
          if (-not $injectedGuardText.Contains("RESULT: TEST INCONCLUSIVE") -or
              $injectedJsonData.status -ne "INCONCLUSIVE" -or $injectedJsonData.exitCode -ne 2) {
            throw "Evidence I/O fault must be INCONCLUSIVE in guard, JSON, and subprocess: $injectedGuardText"
          }
          Write-Host "Windows real subprocess evidence I/O fault -> INCONCLUSIVE guard + JSON PASS"
          Write-Host "VST3 fixture QA PASS"
          exit 0

      - name: Verify zero-test Steinberg validator reports WARNING not PASS
        shell: pwsh
        run: |
          $dispatcher = Get-ChildItem build -Recurse -File -Filter "125A_Plugin_Tester.exe" | Select-Object -First 1
          $gui = Get-ChildItem build -Recurse -File -Filter "125A_Plugin_Tester_GUI.exe" | Select-Object -First 1
          $fixture = Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GoodControl.vst3" | Select-Object -First 1
          if (-not $dispatcher -or -not $gui -or -not $fixture) { throw "Missing production dispatcher, GUI or GoodControl fixture" }
          $reports = Join-Path (Get-Location) "build\qa-validator-zero"
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          $env:125A_PLUGIN_TESTER_REPORT_DIR = $reports
          $env:125A_TESTER_QA_INJECT_VALIDATOR_ZERO_TEST = "1"
          $env:125A_TESTER_QA_STATUS_VST3 = $fixture.FullName
          try {
            & $dispatcher.FullName $fixture.FullName
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) { throw "GoodControl with zero validator tests must finish as WARNING (exit 0), exit=$exitCode" }
            $qa = Get-ChildItem $reports -File -Filter "125A_QA_GoodControl_*_125A_QA_Report.txt" | Select-Object -First 1
            $json = Get-ChildItem $reports -File -Filter "125A_QA_GoodControl_*_125A_QA_Report.json" | Select-Object -First 1
            $validator = Get-ChildItem $reports -File -Filter "125A_QA_GoodControl_*_125A_Steinberg_Validator.txt" | Select-Object -First 1
            $guard = Get-ChildItem $reports -File -Filter "125A_QA_GoodControl_*_125A_QA_Guard_Report.txt" | Select-Object -First 1
            if (-not $qa -or -not $json -or -not $validator -or $guard) { throw "Zero-test validator report/JSON/evidence/guard mismatch" }
            $text = Get-Content $qa.FullName -Raw
            $jt = Get-Content $json.FullName -Raw | ConvertFrom-Json
            $vt = Get-Content $validator.FullName -Raw
            if ($text -notmatch '\[WARN\] Steinberg VST3 validator - NOT TESTED: official Steinberg validator executed 0 test cases' -or
                $text -notmatch 'RELEASE: REVIEW WARNINGS' -or
                $jt.status -ne "WARNING" -or
                $jt.testerVersion -ne "0.3.2" -or
                $vt -notmatch 'Result: 0 tests passed, 0 tests failed') {
              throw "Zero-test validator evidence not classified WARNING, report=$text JSON=$($jt | ConvertTo-Json -Compress)"
            }
            $check = Start-Process -FilePath $gui.FullName -ArgumentList "--qa-check-live-warning" -Wait -PassThru
            if ($check.ExitCode -ne 0) { throw "Production GUI did not classify final zero-validator report as WARNING; exit=$($check.ExitCode)" }
            Write-Host "[PASS] Native zero-test Steinberg validator -> QA WARN NOT TESTED / JSON WARNING / GUI WARNING"
          } finally {
            Remove-Item Env:125A_TESTER_QA_INJECT_VALIDATOR_ZERO_TEST -ErrorAction SilentlyContinue
            Remove-Item Env:125A_TESTER_QA_STATUS_VST3 -ErrorAction SilentlyContinue
            Remove-Item Env:125A_PLUGIN_TESTER_REPORT_DIR -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Verify G3 B01 reload validator and worker infrastructure classifications
        shell: pwsh
        run: |
          # All tests use the real production dispatcher, launcher, worker,
          # report writer, validator wrapper and compiled GUI status function.
          # Stage disposable helper EXEs: NEVER remove the real validator core.
          $names = @(
            "125A_Plugin_Tester.exe",
            "125A_Plugin_Tester_Single.exe",
            "125A_Plugin_Tester_ReloadProbe.exe",
            "125A_Plugin_Tester_StateProbe.exe",
            "125A_Plugin_Tester_EditorLifecycleProbe.exe",
            "125A_Plugin_Tester_IOEventProbe.exe",
            "125A_Plugin_Tester_SteinbergValidator.exe",
            "125A_Plugin_Tester_SteinbergValidatorCore.exe",
            "125A_Plugin_Tester_Worker.exe"
          )
          $stage = Join-Path (Get-Location) "build\g3-b01-disposable"
          $fixture = Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GainReference.vst3" | Select-Object -First 1
          $gui = Get-ChildItem build -Recurse -File -Filter "125A_Plugin_Tester_GUI.exe" | Select-Object -First 1
          if (-not $fixture -or -not $gui) { throw "G3 B01: good fixture or production GUI missing" }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          try {
            foreach ($name in $names) {
              $source = Get-ChildItem build -Recurse -File -Filter $name |
                Where-Object { $_.FullName -notlike "$stage*" } |
                Select-Object -First 1
              if (-not $source) { throw "G3 B01: helper not found $name" }
              Copy-Item -LiteralPath $source.FullName -Destination (Join-Path $stage $name)
              if ($name -eq "125A_Plugin_Tester_SteinbergValidatorCore.exe") {
                $coreSource = $source.FullName
              }
            }
            $dispatcher = Join-Path $stage "125A_Plugin_Tester.exe"
            $coreDestination = Join-Path $stage "125A_Plugin_Tester_SteinbergValidatorCore.exe"
            $env:125A_TESTER_QA_STATUS_VST3 = $fixture.FullName
            $stem = "125A_QA_GainReference"
            function Assert-InfrastructureStatus([string]$phase, [int]$exit) {
              $dir = $env:125A_PLUGIN_TESTER_REPORT_DIR
              $guard = Get-ChildItem -LiteralPath $dir -File -Filter "${stem}_*_125A_QA_Guard_Report.txt" | Select-Object -First 1
              $json = Get-ChildItem -LiteralPath $dir -File -Filter "${stem}_*_125A_QA_Report.json" | Select-Object -First 1
              if ($exit -ne 2 -or -not $guard -or -not $json) {
                throw "G3 B01 ${phase}: expected exit 2 + guard + JSON; actual exit=$exit guard=$guard json=$json"
              }
              $guardText = Get-Content -LiteralPath $guard.FullName -Raw
              $jsonResult = Get-Content -LiteralPath $json.FullName -Raw | ConvertFrom-Json
              if (-not $guardText.Contains("RESULT: TEST INCONCLUSIVE") -or
                  $jsonResult.status -ne "INCONCLUSIVE" -or $jsonResult.exitCode -ne 2) {
                throw "G3 B01 ${phase}: guard/JSON status not INCONCLUSIVE, JSON=$($jsonResult | ConvertTo-Json -Compress)"
              }
              $guiCheck = Start-Process -FilePath $gui.FullName -ArgumentList "--qa-check-live-inconclusive" -Wait -PassThru
              if ($guiCheck.ExitCode -ne 0) {
                throw "G3 B01 ${phase}: production GUI misclassified final report, exit=$($guiCheck.ExitCode)"
              }
              Write-Host "[PASS] G3 B01 ${phase}: real subprocess exit 2 -> launcher/guard/JSON/GUI INCONCLUSIVE"
            }

            # Reload probe's explicit synthetic infrastructure exit is
            # exercised in the REAL child process after successful preflight.
            $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path $stage "reports-reload"
            $env:125A_TESTER_QA_INJECT_RELOAD_INFRA_ERROR = "1"
            try {
              & $dispatcher $fixture.FullName
              $reloadExit = $LASTEXITCODE
            } finally {
              Remove-Item Env:125A_TESTER_QA_INJECT_RELOAD_INFRA_ERROR -ErrorAction SilentlyContinue
            }
            Assert-InfrastructureStatus "reload" $reloadExit

            # Actual missing ValidatorCore on a throwaway EXE copy; never
            # affect the compiled validator core used by the normal tests.
            Remove-Item -LiteralPath $coreDestination -Force
            $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path $stage "reports-validator"
            & $dispatcher $fixture.FullName
            $validatorExit = $LASTEXITCODE
            Assert-InfrastructureStatus "validator-core-missing" $validatorExit
            Copy-Item -LiteralPath $coreSource -Destination $coreDestination

            # The worker opens a real directory as the main QA-report file
            # only AFTER the normal stale-file preflight and processing.
            $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path $stage "reports-worker"
            $env:125A_TESTER_QA_INJECT_WORKER_REPORT_ERROR = "1"
            try {
              & $dispatcher $fixture.FullName
              $workerExit = $LASTEXITCODE
            } finally {
              Remove-Item Env:125A_TESTER_QA_INJECT_WORKER_REPORT_ERROR -ErrorAction SilentlyContinue
            }
            Assert-InfrastructureStatus "worker-report-open" $workerExit
            Write-Host "G3 B01 release blocker negative tests PASS"
          } finally {
            Remove-Item Env:125A_TESTER_QA_INJECT_RELOAD_INFRA_ERROR -ErrorAction SilentlyContinue
            Remove-Item Env:125A_TESTER_QA_INJECT_WORKER_REPORT_ERROR -ErrorAction SilentlyContinue
            Remove-Item Env:125A_TESTER_QA_STATUS_VST3 -ErrorAction SilentlyContinue
            Remove-Item Env:125A_PLUGIN_TESTER_REPORT_DIR -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          }
          # PowerShell Actions appends an implicit LASTEXITCODE gate. The
          # deliberately failing child processes return 2 by contract;
          # after validating all three INCONCLUSIVE classifications, this
          # QA script itself must return success explicitly.
          exit 0

      - name: Verify serial folder scan and aggregate JSON
        shell: pwsh
        run: |
          $launcher = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester.exe | Select-Object -First 1
          if (-not $launcher) { throw "125A_Plugin_Tester.exe not found" }
          $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path (Get-Location) "build\folder-scan-reports"
          Remove-Item $env:125A_PLUGIN_TESTER_REPORT_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:125A_PLUGIN_TESTER_REPORT_DIR | Out-Null
          $scanRoot = Join-Path (Get-Location) "build\folder-scan-fixtures"
          Remove-Item $scanRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $scanRoot | Out-Null
          $good = Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GoodControl.vst3" | Select-Object -First 1
          $bad = Get-ChildItem build -Recurse -Directory -Filter "125A_QA_BadLifecycle.vst3" | Select-Object -First 1
          if (-not $good) { throw "GoodControl folder-scan fixture not found" }
          if (-not $bad) { throw "BadLifecycle folder-scan fixture not found" }
          Copy-Item $good.FullName $scanRoot -Recurse
          Copy-Item $bad.FullName $scanRoot -Recurse
          & $launcher.FullName $scanRoot
          $actual = $LASTEXITCODE
          if ($actual -ne 1) { throw "Folder scan returned $actual; expected 1" }
          $summaryTxt = Join-Path $env:125A_PLUGIN_TESTER_REPORT_DIR "125A_Folder_Scan_Summary.txt"
          $summaryJson = Join-Path $env:125A_PLUGIN_TESTER_REPORT_DIR "125A_Folder_Scan_Summary.json"
          $progressTxt = Join-Path $env:125A_PLUGIN_TESTER_REPORT_DIR "125A_Folder_Scan_Progress.txt"
          foreach ($p in @($summaryTxt,$summaryJson,$progressTxt)) { if (-not (Test-Path $p)) { throw "Folder scan output missing: $p" } }
          $text = Get-Content $summaryTxt -Raw
          foreach ($required in @("Version: 0.3.2","FOUND: 2","PASS: 1","WARNING: 0","FAIL: 1","INCONCLUSIVE: 0","[PASS]","[FAIL]")) { if (-not $text.Contains($required)) { throw "Folder scan summary missing: $required" } }
          $progressText = Get-Content $progressTxt -Raw
          foreach ($required in @("state=complete","total=2","current=2","pass=1","fail=1")) { if (-not $progressText.Contains($required)) { throw "Folder scan progress missing: $required" } }
          $jsonData = Get-Content $summaryJson -Raw | ConvertFrom-Json
          if ($jsonData.schemaVersion -ne 1) { throw "Folder JSON schemaVersion was not 1" }
          if ($jsonData.counts.found -ne 2 -or $jsonData.counts.pass -ne 1 -or $jsonData.counts.fail -ne 1 -or $jsonData.counts.inconclusive -ne 0) { throw "Folder JSON counts incorrect" }
          if ($jsonData.plugins.Count -ne 2) { throw "Folder JSON did not contain exactly two plugins" }
          $statuses = @($jsonData.plugins | ForEach-Object { $_.status })
          if (($statuses | Where-Object { $_ -eq "PASS" }).Count -ne 1 -or ($statuses | Where-Object { $_ -eq "FAIL" }).Count -ne 1) { throw "Folder JSON plugin statuses incorrect" }
          $pluginJson = @(Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "*_125A_QA_Report.json")
          if ($pluginJson.Count -ne 2) { throw "Expected exactly two per-plugin JSON reports; got $($pluginJson.Count)" }
          Write-Host "Folder scan QA PASS"
          exit 0

      - name: Stage single-file portable package
        shell: pwsh
        run: |
          $stub = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_PortableStub.exe | Select-Object -First 1
          $packer = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_HelperPacker.exe | Select-Object -First 1
          $dispatcher = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester.exe | Select-Object -First 1
          $gui = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_GUI.exe | Select-Object -First 1
          $single = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_Single.exe | Select-Object -First 1
          $worker = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_Worker.exe | Select-Object -First 1
          $reloadProbe = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_ReloadProbe.exe | Select-Object -First 1
          $stateProbe = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_StateProbe.exe | Select-Object -First 1
          $editorLifecycleProbe = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_EditorLifecycleProbe.exe | Select-Object -First 1
          $ioEventProbe = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_IOEventProbe.exe | Select-Object -First 1
          $validator = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_SteinbergValidator.exe | Select-Object -First 1
          $validatorCore = Get-ChildItem build -Recurse -File -Filter 125A_Plugin_Tester_SteinbergValidatorCore.exe | Select-Object -First 1
          foreach ($entry in @{Stub=$stub;Packer=$packer;Dispatcher=$dispatcher;GUI=$gui;Single=$single;Worker=$worker;ReloadProbe=$reloadProbe;StateProbe=$stateProbe;EditorLifecycleProbe=$editorLifecycleProbe;IOEventProbe=$ioEventProbe;Validator=$validator;ValidatorCore=$validatorCore}.GetEnumerator()) { if (-not $entry.Value) { throw "$($entry.Key) executable not found" } }
          Remove-Item artifact -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifact | Out-Null
          $portable = Join-Path (Get-Location) "artifact\125A_Plugin_Tester_v0.3.2.exe"
          Copy-Item $stub.FullName $portable -Force
          & $packer.FullName $portable 12501 $gui.FullName 12502 $dispatcher.FullName 12503 $single.FullName 12504 $worker.FullName 12505 $reloadProbe.FullName 12506 $stateProbe.FullName 12507 $ioEventProbe.FullName 12508 $validator.FullName 12509 $validatorCore.FullName 12510 $editorLifecycleProbe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Portable helper embedding failed with exit code $LASTEXITCODE" }

      - name: Verify final portable EXE end to end
        shell: pwsh
        run: |
          $portable = Get-Item artifact\125A_Plugin_Tester_v0.3.2.exe
          $good = Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GoodControl.vst3" | Select-Object -First 1
          $badIO = Get-ChildItem build -Recurse -Directory -Filter "125A_QA_BadIO.vst3" | Select-Object -First 1
          if (-not $good) { throw "GoodControl portable fixture not found" }
          if (-not $badIO) { throw "BadIO portable fixture not found" }
          $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path (Get-Location) "build\portable-reports"
          Remove-Item $env:125A_PLUGIN_TESTER_REPORT_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:125A_PLUGIN_TESTER_REPORT_DIR | Out-Null

          # The public portable binary is a Windows GUI-subsystem executable.
          # PowerShell's call operator does not reliably wait for such programs
          # and may leave $LASTEXITCODE unset. Start-Process -Wait -PassThru is
          # therefore required here so the CI validates the real final EXE exit code.
          $goodProcess = Start-Process -FilePath $portable.FullName -ArgumentList @("--portable-test", $good.FullName) -Wait -PassThru
          if ($goodProcess.ExitCode -ne 0) { throw "Portable GoodControl test returned $($goodProcess.ExitCode); expected 0" }

          # Regression: Windows VST3 may be supplied either as a bundle directory
          # (...\Plugin.vst3\Contents\x86_64-win\Plugin.vst3) or as one standalone
          # binary file ending in .vst3. Exercise the second form through the same
          # public portable entry point to ensure path classification and loading work.
          $goodBinary = Get-ChildItem $good.FullName -Recurse -File -Filter "*.vst3" | Select-Object -First 1
          if (-not $goodBinary) { throw "GoodControl standalone VST3 binary not found inside bundle" }
          $standalone = Join-Path (Get-Location) "build\125A_QA_GoodControl_Standalone.vst3"
          Copy-Item $goodBinary.FullName $standalone -Force
          $standaloneProcess = Start-Process -FilePath $portable.FullName -ArgumentList @("--portable-test", $standalone) -Wait -PassThru
          if ($standaloneProcess.ExitCode -ne 0) { throw "Portable standalone .vst3 test returned $($standaloneProcess.ExitCode); expected 0" }

          $badProcess = Start-Process -FilePath $portable.FullName -ArgumentList @("--portable-test", $badIO.FullName) -Wait -PassThru
          if ($badProcess.ExitCode -ne 1) { throw "Portable BadIO test returned $($badProcess.ExitCode); expected 1" }

          $goodReport = Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "125A_QA_GoodControl_*_125A_QA_Report.txt" | Select-Object -First 1
          $badIoProbe = Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "125A_QA_BadIO_*_125A_IO_Event_Probe.txt" | Select-Object -First 1
          if (-not $goodReport) { throw "Portable GoodControl QA report missing" }
          if (-not $badIoProbe) { throw "Portable BadIO I/O report missing" }
          $goodText = Get-Content $goodReport.FullName -Raw
          if (-not $goodText.Contains("0 WARNING / 0 FAIL")) { throw "Portable GoodControl report was not clean" }
          $badText = Get-Content $badIoProbe.FullName -Raw
          if (-not $badText.Contains("FirstFailure: Bus arrangement - out-of-range bus index was accepted")) { throw "Portable BadIO report did not preserve exact I/O failure diagnosis" }
          Write-Host "Portable single-EXE QA PASS"

      - name: Ensure only one public executable is shipped
        shell: pwsh
        run: |
          if (Get-ChildItem artifact -Recurse -Filter "125A_QA_*.vst3" -ErrorAction SilentlyContinue) { throw "Internal VST3 QA fixtures must not be shipped" }
          $productionExes = @(Get-ChildItem artifact -File -Filter "*.exe")
          if ($productionExes.Count -ne 1) { throw "Portable package must contain exactly one executable; got $($productionExes.Count)" }
          if ($productionExes[0].Name -ne "125A_Plugin_Tester_v0.3.2.exe") { throw "Unexpected portable executable name: $($productionExes[0].Name)" }
          $version = $productionExes[0].VersionInfo
          if ($version.FileVersion -notmatch '^0\.3\.2(\.0)?$' -or $version.ProductVersion -notmatch '^0\.3\.2(\.0)?$') {
            throw "V0.3 version mismatch in actual portable EXE: FileVersion=$($version.FileVersion) ProductVersion=$($version.ProductVersion)"
          }
          Write-Host "[PASS] Portable filename AND Windows EXE VERSIONINFO confirmed 0.3.2"
          # The portable stub embeds several native helpers. A correct
          # VERSIONINFO or top-level GUI title alone cannot prove those
          # helpers and their per-plugin reports were re-versioned.
          $raw = [System.IO.File]::ReadAllBytes($productionExes[0].FullName)
          $latin1 = [System.Text.Encoding]::Latin1.GetString($raw)
          $oldUnicode = [System.Text.Encoding]::Latin1.GetString(
            [System.Text.Encoding]::Unicode.GetBytes("0.2.10"))
          if ($latin1.Contains("0.2.10") -or $latin1.Contains($oldUnicode)) {
            throw "Stale embedded 0.2.10 version literal found in final portable EXE helper payload"
          }
          $newUnicode = [System.Text.Encoding]::Latin1.GetString(
            [System.Text.Encoding]::Unicode.GetBytes("0.3.2"))
          if (-not $latin1.Contains("0.3.2") -or -not $latin1.Contains($newUnicode)) {
            throw "Missing ASCII or UTF-16 0.3.2 literal in final portable EXE"
          }
          Write-Host "[PASS] Embedded launcher, worker, GUI and resource version literals verified: no 0.2.10"


      - name: Upload fixture diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Plugin-Tester-Fixture-Diagnostics
          path: |
            build/qa-reports/*
            build/folder-scan-reports/*
            build/portable-reports/*
          if-no-files-found: warn

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Plugin-Tester-v0.3.2-Windows-x64
          path: artifact/
