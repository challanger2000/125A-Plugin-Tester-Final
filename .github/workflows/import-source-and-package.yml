name: Rebuild complete Windows download package

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source-and-package.yml']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows download ZIP and verify contents
        shell: pwsh
        run: |
          $zip = 'dist\125A-Plugin-Tester-v0.2.0-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          New-Item -ItemType Directory -Path package-root -Force | Out-Null

          Copy-Item 125A_Plugin_Tester.exe package-root\ -Force
          Copy-Item README.md package-root\ -Force
          Copy-Item LICENSE-NOTE.txt package-root\ -Force
          Copy-Item docs\125A_Plugin_Tester_Handbuch_DE.pdf package-root\ -Force
          Copy-Item docs\125A_Plugin_Tester_User_Guide_EN.pdf package-root\ -Force

          Compress-Archive -Path package-root\* -DestinationPath $zip -Force
          Remove-Item package-root -Recurse -Force

          New-Item -ItemType Directory -Path verify -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath verify -Force
          $required = @(
            'verify\125A_Plugin_Tester.exe',
            'verify\README.md',
            'verify\LICENSE-NOTE.txt',
            'verify\125A_Plugin_Tester_Handbuch_DE.pdf',
            'verify\125A_Plugin_Tester_User_Guide_EN.pdf'
          )
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing from ZIP: $f" } }
          $count = (Get-ChildItem verify -File).Count
          if ($count -ne 5) { throw "Unexpected file count in ZIP: $count" }
          Remove-Item verify -Recurse -Force

      - name: Commit corrected Windows package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist\125A-Plugin-Tester-v0.2.0-Windows-x64.zip
          git commit -m "Add README and license to Windows release ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
