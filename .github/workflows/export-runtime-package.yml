name: Export final runtime package

on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-runtime-package.yml']

jobs:
  export:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Stage runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path export -Force | Out-Null
          Copy-Item 125A_Plugin_Tester.exe export\ -Force
          Copy-Item README.md export\ -Force
          Copy-Item LICENSE-NOTE.txt export\ -Force
          Copy-Item docs\125A_Plugin_Tester_Handbuch_DE.pdf export\ -Force
          Copy-Item docs\125A_Plugin_Tester_User_Guide_EN.pdf export\ -Force
      - name: Verify runtime files
        shell: pwsh
        run: |
          $required = @(
            'export\125A_Plugin_Tester.exe',
            'export\README.md',
            'export\LICENSE-NOTE.txt',
            'export\125A_Plugin_Tester_Handbuch_DE.pdf',
            'export\125A_Plugin_Tester_User_Guide_EN.pdf'
          )
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing: $f" } }
      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Plugin-Tester-Runtime-v0.2.0
          path: export
          if-no-files-found: error
          compression-level: 9
